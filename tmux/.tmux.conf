set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Auto-rename window to the current directory name
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Re-index windows sequentially when one is closed
set -g renumber-windows on

# use Ctrl + a as prefix
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# How long (ms) tmux waits after Esc to see if it starts a key sequence (e.g. Alt+key).
# Default 500 makes Esc in nvim feel laggy; 1 = near-instant mode switch.
set -sg escape-time 1

# set base index to 1
set -g base-index 1

# Set the base index for panes to 1 instead of 0
setw -g pane-base-index 1

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# new window with same directory as previous one
bind c new-window -c "#{pane_current_path}"

# new pane with same directory as previous one
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# History setting
set -g history-limit 100000

# Ctrl-z: Zoom window and back
bind -n C-z resize-pane -Z

# prefix + l: session/window picker
# Highlighted row in the orange-on-navy theme (also used for copy-mode selection)
# Keep hex lowercase: tmux >= 3.6 copies this into copy-mode-selection-style via #{E:mode-style},
# which expands "#F" (window flags) inside "#FCA02F" and breaks the selection highlight.
set -g mode-style "fg=#09141b,bg=#fca02f,bold"
# Sessions: "3 windows ● attached"   Windows: "add-login ● (2 panes)"
bind l choose-tree -Zs -O name -F "#{?pane_format,#{pane_current_command},#{?window_format,#{window_name}#{?window_active, #[fg=#FCA02F]●,}#{?#{>:#{window_panes},1}, #[fg=#434B53](#{window_panes} panes),},#{session_windows} windows#{?session_attached, #[fg=#FCA02F]● attached,}}}"

bind j switch-client -n \; refresh-client -S
bind k switch-client -p \; refresh-client -S

# prefix + Q: kill the current session (asks first)
bind Q confirm-before -p "kill session #S? (y/n)" kill-session
# Killing the current session switches to another one instead of exiting tmux
set -g detach-on-destroy off

# copy text between 2 space
bind -n -T copy-mode-vi C-i send-keys B \; send -X begin-selection \; send-keys E
#bind-key -T copy-mode-vi ']' send-keys F '['\; send -X begin-selection \; send-keys f ']'

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize panes; -r lets you repeat (prefix H H H) within repeat-time without re-pressing prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move current window left/right — focus follows the moved window
# Usage: Ctrl+Shift+Left / Ctrl+Shift+Right
bind-key -n C-S-Left  swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

set -g mouse on

# Pass focus in/out to apps so nvim's autoread picks up files changed by Claude/other panes
set -g focus-events on

# Use Vi mode in copy mode
setw -g mode-keys vi
# Emacs keys in tmux prompts (prefix+N branch name, y/n confirms, prefix+:) so Esc cancels
# at once. tmux defaults to vi here because $EDITOR is nvim, where Esc only enters normal mode.
set -g status-keys emacs

# window-copy without losing scrollback position
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
# y: copy to system clipboard and stay in copy mode. pbcopy on macOS, xclip on Linux;
# set-clipboard also sends OSC 52 so copying works over SSH in iTerm2/Ghostty.
set -s set-clipboard on
if-shell 'command -v pbcopy' \
  'bind-key -T copy-mode-vi y send -X copy-pipe "pbcopy" \; send -X clear-selection' \
  'bind-key -T copy-mode-vi y send -X copy-pipe "xclip -selection clipboard" \; send -X clear-selection'
unbind -T copy-mode-vi MouseDragEnd1Pane

setw -g monitor-activity on
set -g visual-activity on

#
set -g default-shell $SHELL
#set -g default-command "reattach-to-user-namespace -l ${SHELL}"


# ── Theme (colours from config/nvim/colors/custom-theme.lua) ─────────────────
# Palette reference:
#   bg=#09141B  bg_light=#18384D  gray=#434B53   orange=#FCA02F
#   fg=#E8D3BB  tan=#DEB88D       teal=#358794   cyan=#50A3B5

# Status bar
set -g status-style          fg=#DEB88D,bg=black

# Inactive tab: muted index + theme fg, darker bg
# #{?window_activity_flag,...} appends an orange * when there is unseen activity
set -g window-status-format         " #[fg=#50a3b5]#I #[fg=#E8D3BB]#W#{?window_activity_flag,#[fg=#FCA02F]*,} "
set -g window-status-style          fg=#E8D3BB,bg=#235470

# Keep same colors on activity — only the * indicates an update, no color flash
set -g window-status-activity-style fg=#E8D3BB,bg=#235470

# Active tab: orange index + theme fg, lighter bg to stand out
set -g window-status-current-format " #[fg=#FCA02F,bold]#I #[fg=#E8D3BB,bold]#W "
set -g window-status-current-style  fg=#E8D3BB,bg=#09141B,bold

# Separator between tabs
set -g window-status-separator      "#[fg=#434B53,bg=#18384D]│"

# Pane borders
set -g pane-border-style            fg=#434B53,bg=#09141B
set -g pane-active-border-style     fg=#FCA02F,bg=#09141B,bold

# Dim inactive panes
set -g window-style                 fg=#6d7f8b,bg=#09141B
set -g window-active-style          fg=#E8D3BB,bg=#09141B

# Status left: session name in teal, window/pane index in orange/cyan
set -g status-left-length 40
set -g status-left "#[fg=#358794]#S #[fg=#434B53]│ #[fg=#FCA02F]#I#[fg=#434B53]:#[fg=#50A3B5]#P"

set -g status-justify centre
set -g status-position bottom

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# Pass C-hjkl through to (n)vim and fzf, otherwise move between panes. Matched by tmux itself
# (no shell per keypress); single quotes keep tmux from expanding the regex's `$`.
bind -n C-h if -F '#{m/ri:^(n?vim|fzf)$,#{pane_current_command}}' 'send C-h' 'select-pane -L'
bind -n C-j if -F '#{m/ri:^(n?vim|fzf)$,#{pane_current_command}}' 'send C-j' 'select-pane -D'
bind -n C-k if -F '#{m/ri:^(n?vim|fzf)$,#{pane_current_command}}' 'send C-k' 'select-pane -U'
bind -n C-l if -F '#{m/ri:^(n?vim|fzf)$,#{pane_current_command}}' 'send C-l' 'select-pane -R'
#bind -n C-\ run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys 'C-\\') || tmux select-pane -l"

# ws: git worktree task windows — prefix+W pick a task, prefix+N new task, prefix+X finish this task
# (~/.local/bin path: popups may not have it on PATH)
bind W display-popup -E -w 80% -h 60% -d "#{pane_current_path}" "~/.local/bin/ws open"
bind N command-prompt -p "new task branch:" "display-popup -E -w 80% -h 60% -d '#{pane_current_path}' '~/.local/bin/ws new %1'"
# Asks first (ws rm removes the worktree immediately). -EE: popup stays open on failure
# (dirty worktree, main checkout) so the error is readable; q/Esc closes it
bind X confirm-before -p "finish task #W (remove worktree)? (y/n)" {
  display-popup -EE -w 60% -h 30% -d "#{pane_current_path}" "~/.local/bin/ws rm"
}

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
